name: Staging Startup

on:
  schedule:
    - cron: '0 3 * * 1-5'    # 6AM EAT (03:00 UTC) Mon-Fri
    - cron: '0 6 * * 6,0'    # 9AM EAT (06:00 UTC) Sat-Sun
  workflow_dispatch:

concurrency:
  group: staging-lifecycle
  cancel-in-progress: false

permissions: {}

env:
  STAGING_CLUSTER_NAME: airqo-aks-staging
  STAGING_HAPROXY_VM: haproxy-staging
  RESOURCE_GROUP: airqo-main-rg

jobs:
  start-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Start HAProxy staging VM and wait for running state
        run: |
          echo "Starting ${{ env.STAGING_HAPROXY_VM }}..."
          az vm start \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.STAGING_HAPROXY_VM }}

          echo "Polling for VM running state (max 5 minutes)..."
          TIMEOUT=300
          INTERVAL=15
          ELAPSED=0

          while [ $ELAPSED -lt $TIMEOUT ]; do
            POWER_STATE=$(az vm get-instance-view \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --name ${{ env.STAGING_HAPROXY_VM }} \
              --query "instanceView.statuses[?starts_with(code, 'PowerState')].displayStatus" \
              -o tsv)

            echo "Power state: $POWER_STATE (${ELAPSED}s elapsed)"

            if [ "$POWER_STATE" = "VM running" ]; then
              echo "VM successfully started"
              break
            fi

            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          if [ "$POWER_STATE" != "VM running" ]; then
            echo "ERROR: VM did not reach running state within ${TIMEOUT}s. Last state: $POWER_STATE"
            exit 1
          fi

      - name: Start AKS staging cluster
        run: |
          echo "Starting AKS cluster..."
          az aks start \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.STAGING_CLUSTER_NAME }}
          echo "AKS cluster started successfully"

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.STAGING_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Wait for nodes to be ready
        run: |
          echo "Waiting for all nodes to be Ready (max 8 minutes)..."
          kubectl wait --for=condition=Ready nodes --all --timeout=480s
          echo "All nodes ready"

      - name: Wait for nginx-ingress
        run: |
          echo "Waiting for nginx-ingress DaemonSet..."
          kubectl rollout status daemonset/nginx-ingress \
            -n nginx-ingress \
            --timeout=120s
          echo "nginx-ingress ready"

      - name: Wait for staging deployments to be ready
        run: |
          echo "Waiting for all staging deployments to be available..."
          FAILED=()

          DEPLOYMENTS=$(kubectl get deployments -n staging \
            --no-headers -o custom-columns="NAME:.metadata.name") || {
            echo "ERROR: Failed to list deployments in staging namespace"
            kubectl get deployments -n staging || true
            exit 1
          }

          if [ -z "$DEPLOYMENTS" ]; then
            echo "ERROR: No deployments found in staging namespace — aborting to avoid false success"
            exit 1
          fi

          while IFS= read -r DEPLOY; do
            echo "Checking $DEPLOY..."
            kubectl rollout status deployment/"$DEPLOY" \
              -n staging \
              --timeout=180s || FAILED+=("$DEPLOY")
          done <<< "$DEPLOYMENTS"

          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "ERROR: The following deployments did not become ready:"
            printf '  %s\n' "${FAILED[@]}"
            exit 1
          fi

          echo "All staging deployments ready"

      - name: Summary
        run: |
          echo "=== Startup Summary ==="
          echo "Time: $(date)"
          echo ""
          echo "--- AKS Cluster State ---"
          az aks show \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.STAGING_CLUSTER_NAME }} \
            --query "{name:name, powerState:powerState.code, provisioningState:provisioningState}" \
            -o table
          echo ""
          echo "--- Nodes ---"
          kubectl get nodes
          echo ""
          echo "--- Staging Pods ---"
          kubectl get pods -n staging
          echo ""
          echo "--- Running Pod Count ---"
          RUNNING=$(kubectl get pods -n staging \
            --field-selector=status.phase=Running \
            --no-headers | wc -l)
          echo "Running pods in staging: $RUNNING"
          echo ""
          echo "--- nginx-ingress ---"
          kubectl get pods -n nginx-ingress
          echo ""
          echo "--- Kafka pods ---"
          kubectl get pods -n message-broker