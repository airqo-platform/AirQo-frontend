name: Staging Startup

on:
  schedule:
    - cron: '0 3 * * 1-5'    # 6AM EAT (03:00 UTC) Mon-Fri
    - cron: '0 6 * * 6,0'    # 9AM EAT (06:00 UTC) Sat-Sun
  workflow_dispatch:

concurrency:
  group: staging-lifecycle
  cancel-in-progress: false

permissions: {}

env:
  STAGING_CLUSTER_NAME: airqo-aks-staging
  STAGING_HAPROXY_VM: haproxy-staging
  RESOURCE_GROUP: airqo-main-rg

jobs:
  start-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Start HAProxy staging VM
        run: |
          echo "Starting ${{ env.STAGING_HAPROXY_VM }}..."
          az vm start \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.STAGING_HAPROXY_VM }}
          echo "VM started"

      - name: Scale up AKS workload nodes
        run: |
          echo "Restoring autoscaler bounds to min 2, max 4..."
          az aks nodepool update \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --cluster-name ${{ env.STAGING_CLUSTER_NAME }} \
            --name workload \
            --update-cluster-autoscaler \
            --min-count 2 \
            --max-count 4
          echo "Autoscaler bounds restored — autoscaler will provision nodes"

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.STAGING_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Wait for workload nodes to appear and be ready
        run: |
          echo "Waiting for at least 2 workload nodes to appear (max 8 minutes)..."
          EXPECTED_NODES=2
          TIMEOUT=480
          INTERVAL=20
          DEADLINE=$(( $(date +%s) + TIMEOUT ))

          while true; do
            NOW=$(date +%s)
            REMAINING=$(( DEADLINE - NOW ))

            if [ $REMAINING -le 0 ]; then
              echo "ERROR: Expected $EXPECTED_NODES workload nodes but only $NODE_COUNT appeared within ${TIMEOUT}s"
              exit 1
            fi

            # Bound the kubectl request itself so a stalled API call
            # does not silently consume the entire deadline
            REQUEST_TIMEOUT=$(( REMAINING < 30 ? REMAINING : 30 ))

            if ! NODES=$(kubectl get nodes \
              --selector=kubernetes.azure.com/agentpool=workload \
              --no-headers \
              --request-timeout="${REQUEST_TIMEOUT}s" 2>&1); then
              echo "ERROR: Failed to list workload nodes — check AKS credentials and API connectivity"
              echo "$NODES"
              exit 1
            fi

            NODE_COUNT=$(printf '%s\n' "$NODES" | grep -c . || true)

            if [ "$NODE_COUNT" -ge "$EXPECTED_NODES" ]; then
              echo "Workload nodes appearing ($NODE_COUNT/$EXPECTED_NODES)"
              break
            fi

            # Cap sleep to remaining time so we never overshoot the deadline
            SLEEP=$(( INTERVAL < REMAINING ? INTERVAL : REMAINING ))
            echo "Waiting for nodes ($NODE_COUNT/$EXPECTED_NODES present, ${REMAINING}s remaining)..."
            sleep "$SLEEP"
          done

          echo "Waiting for Ready state..."
          kubectl wait node \
            --for=condition=Ready \
            --selector=kubernetes.azure.com/agentpool=workload \
            --timeout=300s
          echo "Workload nodes ready"

      - name: Wait for nginx-ingress
        run: |
          echo "Waiting for nginx-ingress DaemonSet..."
          kubectl rollout status daemonset/nginx-ingress \
            -n nginx-ingress \
            --timeout=120s
          echo "nginx-ingress ready"

      - name: Wait for staging deployments to be ready
        run: |
          echo "Waiting for all staging deployments to be available..."
          FAILED=()

          DEPLOYMENTS=$(kubectl get deployments -n staging \
            --no-headers -o custom-columns="NAME:.metadata.name") || {
            echo "ERROR: Failed to list deployments in staging namespace"
            kubectl get deployments -n staging || true
            exit 1
          }

          if [ -z "$DEPLOYMENTS" ]; then
            echo "ERROR: No deployments found in staging namespace — aborting to avoid false success"
            exit 1
          fi

          while IFS= read -r DEPLOY; do
            echo "Checking $DEPLOY..."
            kubectl rollout status deployment/"$DEPLOY" \
              -n staging \
              --timeout=180s || FAILED+=("$DEPLOY")
          done <<< "$DEPLOYMENTS"

          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "ERROR: The following deployments did not become ready:"
            printf '  %s\n' "${FAILED[@]}"
            exit 1
          fi

          echo "All staging deployments ready"

      - name: Summary
        run: |
          echo "=== Startup Summary ==="
          echo "Time: $(date)"
          echo ""
          echo "--- Nodes ---"
          kubectl get nodes
          echo ""
          echo "--- Staging Pods ---"
          kubectl get pods -n staging
          echo ""
          echo "--- Running Pod Count ---"
          RUNNING=$(kubectl get pods -n staging \
            --field-selector=status.phase=Running \
            --no-headers | wc -l)
          echo "Running pods in staging: $RUNNING"
          echo ""
          echo "--- nginx-ingress ---"
          kubectl get pods -n nginx-ingress